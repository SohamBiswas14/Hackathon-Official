<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Centauri - Phase 4</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        neon: '#00f3ff',
                        danger: '#ff2a2a',
                        warn: '#ff8c00'
                    },
                    animation: {
                        'spin-slow': 'spin 18s linear infinite',
                        'spin-reverse': 'spin 18s linear infinite reverse',
                        'glitch': 'glitch 0.2s infinite',
                        'pan-image': 'pan 20s ease-in-out infinite alternate',
                        'scanline': 'scan 4s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '0%, 100%': {
                                transform: 'translate(0)'
                            },
                            '20%': {
                                transform: 'translate(-2px, 2px)'
                            },
                            '40%': {
                                transform: 'translate(-2px, -2px)'
                            },
                            '60%': {
                                transform: 'translate(2px, 2px)'
                            },
                            '80%': {
                                transform: 'translate(2px, -2px)'
                            },
                        },
                        pan: {
                            '0%': {
                                transform: 'scale(1.1) translate(0, 0)'
                            },
                            '100%': {
                                transform: 'scale(1.2) translate(-2%, -2%)'
                            }
                        },
                        scan: {
                            '0%': {
                                transform: 'translateY(-100vh)'
                            },
                            '100%': {
                                transform: 'translateY(100vh)'
                            }
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./phase4style.css">
</head>

<body class="bg-void text-neon font-mono overflow-hidden h-screen w-screen selection:bg-neon selection:text-black">

    <!-- SCENE 1: IMMERSIVE APOD SECURITY TERMINAL -->
    <div id="scene-apod-lock" class="absolute inset-0 z-50 overflow-hidden bg-black transition-opacity duration-1000">

        <!-- Cinematic Fullscreen Background -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Pillars_of_creation_2014_HST_WFC3-UVIS_full-res_denoised.jpg/400px-Pillars_of_creation_2014_HST_WFC3-UVIS_full-res_denoised.jpg" alt="NASA APOD" class="absolute inset-0 w-full h-full object-cover opacity-40 animate-pan-image">

        <!-- Tactical Grid & Scanner -->
        <div class="absolute inset-0 bg-[linear-gradient(rgba(0,243,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(0,243,255,0.05)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>
        <div class="absolute top-0 left-0 w-full h-[2px] bg-neon opacity-50 shadow-[0_0_15px_#00f3ff] animate-scanline pointer-events-none"></div>

        <!-- Centered Command Line UI -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-full max-w-2xl bg-black/90 border-2 border-neon p-10 backdrop-blur-md shadow-[0_0_40px_rgba(0,243,255,0.2)] pointer-events-auto text-center rounded-sm">
                <h2 class="text-4xl md:text-5xl font-black tracking-[0.3em] mb-3 text-white">ALPHA 9 <span class="text-neon">NEXUS</span></h2>
                <p class="text-neon/70 text-sm tracking-widest mb-10 uppercase">Awaiting Visual Database Decryption...</p>

                <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-4">
                    <span class="text-neon font-bold text-lg">root@alpha-9:~$</span>
                    <input type="text" id="apod-input" placeholder="ENTER DESIGNATION" autocomplete="off" class="bg-black/50 border border-neon text-white px-4 py-3 uppercase tracking-widest w-full md:w-2/3 outline-none focus:shadow-[0_0_15px_#00f3ff] transition-all text-center md:text-left">
                </div>

                <div class="flex flex-col items-center mt-10 space-y-4">
                    <p id="apod-error" class="text-danger animate-pulse hidden tracking-widest text-sm font-bold">ERR: DESIGNATION INVALID</p>
                    <button id="btn-unlock-apod" class="border-2 border-neon text-neon hover:bg-neon hover:text-black transition-all px-10 py-3 font-bold tracking-widest text-lg w-full md:w-auto">
            [ EXECUTE ]
          </button>
                </div>
            </div>
        </div>
    </div>

    <!-- GLITCH OVERLAY -->
    <div id="glitch-screen" class="absolute inset-0 bg-white z-[999] opacity-0 pointer-events-none transition-opacity"></div>

    <!-- SCENE 2: THE CORE OF ALPHA 9 -->
    <div id="scene-core" class="absolute inset-0 hidden flex items-center justify-center">

        <h1 class="absolute top-10 left-10 text-2xl font-black tracking-[0.3em] drop-shadow-[0_0_15px_rgba(0,243,255,0.8)] z-10">CORE // ALPHA 9</h1>

        <!-- FIXED BOMB HUD (With Defined Number Boundaries) -->
        <div class="absolute top-10 right-10 z-40 border border-danger/40 bg-black/80 backdrop-blur-md p-5 shadow-[0_0_30px_rgba(255,42,42,0.2)] rounded-md">
            <p class="text-danger/90 text-xs tracking-[0.3em] font-black border-b border-danger/30 pb-2 mb-4 text-center">CRITICAL THREAT</p>

            <div class="flex items-center justify-center space-x-3">
                <span class="text-white/40 text-sm font-bold tracking-widest">T-MINUS</span>

                <!-- DEFINED BOUNDARY FOR NUMBERS -->
                <div id="timer-boundary" class="bg-red-950/50 border-2 border-danger rounded-md px-4 py-2 min-w-[100px] flex items-center justify-center shadow-[inset_0_0_10px_rgba(255,0,0,0.2)] transition-colors">
                    <div id="bomb-timer" class="text-4xl text-danger font-black drop-shadow-[0_0_12px_rgba(255,42,42,0.9)] leading-none tracking-wider">180</div>
                </div>

                <span class="text-white/40 text-sm font-bold tracking-widest">SEC</span>
            </div>
        </div>

        <!-- Dyson Sphere System -->
        <!-- Dyson Sphere System -->
        <div class="relative flex items-center justify-center perspective-container">

            <!-- 1. The Core (Hot like the sun) -->
            <div id="orb-hitbox" class="absolute w-40 h-40 bg-gradient-to-br from-yellow-200 via-orange-500 to-red-600 rounded-full animate-solar z-20 cursor-pointer"></div>

            <!-- 2. UPGRADED METALLIC RINGS -->

            <!-- Outer Ring: Double-lined Structural Band -->
            <div class="absolute w-[480px] h-[480px] border-[12px] border-double border-zinc-500 rounded-full animate-spin-slow ring-x opacity-70 shadow-[0_0_30px_rgba(255,140,0,0.2)] z-10 pointer-events-none"></div>

            <!-- Middle Ring: Simulated 3D Metal (Light top reflection, dark bottom shadow) -->
            <div class="absolute w-[400px] h-[400px] border-t-[10px] border-b-[10px] border-r-[4px] border-l-[4px] border-t-zinc-300 border-b-zinc-950 border-l-zinc-600 border-r-zinc-600 rounded-full animate-spin-reverse ring-y shadow-[0_0_20px_rgba(0,0,0,0.9)] z-10 pointer-events-none mix-blend-hard-light"></div>

            <!-- Inner Ring: Precision HUD Crosshair -->
            <div class="absolute w-[310px] h-[310px] border-[2px] border-white/20 rounded-full animate-spin-slow ring-z z-10 pointer-events-none flex items-center justify-center drop-shadow-[0_0_5px_white]">
                <!-- Crosshair targeting lines passing behind the sun -->
                <div class="absolute w-[350px] h-[1px] bg-white/30"></div>
                <div class="absolute h-[350px] w-[1px] bg-white/30"></div>
            </div>

            <!-- 3. The Roaming Nuclear Bomb Icon -->
            <div class="absolute w-[650px] h-[650px] animate-spin-slow z-30 pointer-events-none">
                <div id="orbiting-bomb" class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer group transition-transform duration-300 hover:scale-125">
                    <div class="animate-spin-reverse flex flex-col items-center justify-center drop-shadow-[0_0_20px_rgba(0,0,0,0.8)] bg-black/40 rounded-full p-4 backdrop-blur-sm border border-danger/30">
                        <span id="bomb-label" class="text-danger font-black tracking-widest text-[10px] mb-1 animate-pulse">MISSION CONTROL</span>
                        <!-- SVG Bomb Icon -->
                        <svg id="bomb-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff2a2a" stroke-width="1.5" class="drop-shadow-[0_0_15px_rgba(255,42,42,1)]">
              <path d="M12 2L15 8H9L12 2Z" fill="#ff2a2a" fill-opacity="0.3"/>
              <path d="M9 8V18C9 19.1 9.9 20 11 20H13C14.1 20 15 19.1 15 18V8"/>
              <path d="M7 16L9 18M17 16L15 18"/>
              <circle cx="12" cy="12" r="1.5"/>
              <path d="M12 13.5V16"/>
            </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Centered Hidden Code Reveal -->
        <div id="hidden-code-3" class="absolute top-1/4 left-1/2 -translate-x-1/2 bg-black/95 border-2 border-neon text-neon px-8 py-4 shadow-[0_0_30px_rgba(0,243,255,0.6)] hidden z-40 font-black tracking-[0.2em] pointer-events-none backdrop-blur-md rounded-sm text-xl">
            > DECRYPTED: OMEGA_PROTOCOL
        </div>
    </div>

    <!-- THE HACKING TERMINAL (Defusal Modal) -->
    <div id="hacking-terminal" class="absolute inset-0 bg-black/95 hidden z-[100] flex items-center justify-center backdrop-blur-lg">
        <div class="border-2 border-warn p-10 w-[500px] shadow-[0_0_50px_rgba(255,140,0,0.2)]">
            <h2 class="text-warn text-2xl font-bold tracking-widest mb-6 border-b border-warn pb-2">SYSTEM OVERRIDE // DEFUSAL</h2>
            <p class="text-warn/80 mb-6 text-sm">INPUT 3-PHASE SHUTDOWN SEQUENCE:</p>

            <div class="space-y-4 mb-8">
                <input type="text" id="code-1" placeholder="> CODE_1" class="w-full bg-black border border-warn text-warn px-4 py-3 tracking-widest uppercase outline-none focus:shadow-[0_0_15px_#ff8c00]">
                <input type="text" id="code-2" placeholder="> CODE_2" class="w-full bg-black border border-warn text-warn px-4 py-3 tracking-widest uppercase outline-none focus:shadow-[0_0_15px_#ff8c00]">
                <input type="text" id="code-3" placeholder="> CODE_3" class="w-full bg-black border border-warn text-warn px-4 py-3 tracking-widest uppercase outline-none focus:shadow-[0_0_15px_#ff8c00]">
            </div>

            <button id="btn-defuse" class="w-full bg-black border border-warn text-warn hover:bg-warn hover:text-black font-bold py-3 tracking-widest transition-colors">
        [ INITIATE DEFUSAL ]
      </button>

            <button id="btn-close-terminal" class="w-full mt-4 text-warn/50 hover:text-warn text-sm tracking-widest transition-colors">
        [ CANCEL / RETURN TO CORE ]
      </button>

            <p id="defuse-error" class="text-danger mt-4 text-center hidden animate-pulse">SEQUENCE REJECTED. TRY AGAIN.</p>
        </div>
    </div>

    <!-- CENTERED ENDING DIALOGUE -->
    <div id="ending-dialogue" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 max-w-4xl bg-black/95 border-2 border-neon p-10 hidden z-[200] shadow-[0_0_50px_rgba(0,243,255,0.3)] text-center rounded-md">
        <p id="dialogue-text" class="text-neon text-xl md:text-2xl font-mono leading-relaxed tracking-wide"></p>
    </div>

    <script src="./phase4.js"></script>
</body>

</html>
