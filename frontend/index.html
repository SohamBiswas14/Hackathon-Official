<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteria Terminal</title>
    <!-- Imports the retro terminal font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <header>
            <h1 class="glitch">ASTERIA_TERMINAL</h1>
            <p class="subtitle">SYS.OP: RECRUIT_739 // TARGET: COSMO_POLO</p>
        </header>

        <main class="login-box">
            <div class="status-bar">
                <span>CONNECTION: <span class="blink">SECURE</span></span>
                <span>AUTH_REQUIRED</span>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label>> RECRUIT_ID_</label>
                    <input type="text" autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <label>> PASSKEY_</label>
                    <input type="password" required>
                </div>

                <button type="submit" class="neon-btn">[ INITIATE_WARP ]</button>
            </form>
        </main>
    </div>
</body>
</html>
