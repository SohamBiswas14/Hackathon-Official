<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteria - Planet Sonic Enigma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body class="relative w-screen h-screen select-none">

    <!-- Top HUD -->
    <div class="absolute top-6 left-6 z-10 pointer-events-none">
        <h1 class="text-xl font-bold tracking-widest text-[#00ff00] drop-shadow-[0_0_8px_#00ff00]">SYSTEM: SONIC ENIGMA</h1>
        <p class="text-xs text-[#00ff00] opacity-75">STATUS: UNKNOWN</p>
    </div>

    <!-- Settings Button -->
    <div class="absolute top-6 right-6 z-10">
        <button class="border border-[#00ff00] px-3 py-1 text-xs hover:bg-[#00ff00] hover:text-black transition-colors">[ SETTINGS ]</button>
    </div>

    <!-- Inventory Uplink Footer -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center">
        <span class="text-xs tracking-widest opacity-70 mb-2">INVENTORY_UPLINK</span>
        <div class="border border-[#00ff00] bg-black bg-opacity-80 p-2 flex gap-4">
            <button id="btn-map" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Map</button>
            <button id="btn-book" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Great Library Book</button>
            <button id="btn-radio" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Radio Tuner</button>
            <button id="btn-hacking" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Hacking System</button>
            <button id="btn-poison" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Poison</button>
            <button id="btn-hints" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Hints</button>
        </div>
    </div>

    <!-- Death Screen (Hidden by default) -->
    <div id="death-screen" class="hidden fixed inset-0 bg-red-950/90 z-50 flex flex-col justify-center items-center font-mono text-red-500">
        <h1 class="text-6xl font-bold mb-4 tracking-widest drop-shadow-[0_0_15px_red]">FATAL ERROR</h1>
        <p class="text-white text-xl">System contaminated by toxin ingestion.</p>
        <button onclick="location.reload()" class="mt-8 border border-red-500 text-red-500 px-6 py-2 hover:bg-red-500 hover:text-black transition-colors">[ REBOOT SYSTEM ]</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Phase 2 Game Logic -->
    <script src="phase2.js"></script>
</body>

</html>
