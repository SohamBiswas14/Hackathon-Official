<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteria - Planet Sonic Enigma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Share Tech Mono', monospace; overflow: hidden; background-color: #050505; color: #00ff00; }
        /* This is where Three.js will inject the 3D canvas */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body class="text-green-500 selection:bg-green-500 selection:text-black">

    <!-- 3D Star Map Background -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-layer flex flex-col justify-between h-screen p-6">
        
        <!-- Top Bar: Settings -->
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]">SYSTEM: SONIC ENIGMA</h1>
                <p class="text-sm">STATUS: UNKNOWN</p>
            </div>
            <button id="btn-settings" class="interactive border border-green-500 px-4 py-2 hover:bg-green-500 hover:text-black transition">
                [ SETTINGS ]
            </button>
        </div>

        <!-- Bottom Bar: Inventory Dock -->
        <div class="flex flex-col items-center pb-4">
            <p class="mb-2 text-sm border-b border-green-500/50 pb-1">INVENTORY_UPLINK</p>
            <div class="interactive flex gap-4 bg-black/80 p-4 border border-green-500/50 rounded">
                <!-- Inventory Items -->
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500" data-item="map">Map</button>
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500" data-item="book">Great Library Book</button>
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500" data-item="tuner">Radio Tuner</button>
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500" data-item="hack">Hacking System</button>
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500 text-green-500" data-item="poison">Poison</button>
                <button class="inv-item border border-gray-600 px-3 py-1 hover:border-green-500" data-item="hints">Hints</button>
            </div>
        </div>
    </div>

    <!-- Action Menu (Pops up when clicking an item) -->
    <div id="action-menu" class="interactive hidden absolute bg-black border border-green-500 p-2 flex flex-col gap-2 z-20">
        <button id="btn-use" class="hover:bg-green-500 hover:text-black px-4 py-1 text-left">USE</button>
        <button id="btn-drop" class="hover:bg-green-500 hover:text-black px-4 py-1 text-left">DROP</button>
    </div>

    <!-- Death Screen (Hidden by default) -->
    <div id="death-screen" class="interactive hidden fixed inset-0 bg-red-900/90 flex flex-col items-center justify-center p-8 z-50 text-center">
        <h1 class="text-6xl font-bold text-black mb-4 tracking-widest">FATAL ERROR</h1>
        <p class="text-white text-2xl font-mono">lol imagine getting eliminated by yourself 😂 gg ez</p>
        <button onclick="location.reload()" class="mt-8 border border-black text-black px-6 py-2 hover:bg-black hover:text-red-500 transition">REBOOT_SYSTEM</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="phase2.js"></script>
</body>
</html>
