<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteria - Planet Sonic Enigma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/game-tools.css">
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .signal-overlay {
            display: grid;
            place-items: center;
            isolation: isolate;
            background: rgba(1, 7, 12, 0.9);
            backdrop-filter: blur(9px);
        }

        .signal-overlay.hidden { display: none; }
        .signal-overlay:not(.hidden) { display: grid; }

        .signal-grid {
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.32;
            background-image: linear-gradient(rgba(0, 243, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.12) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse at center, black 15%, transparent 78%);
        }

        .signal-panel {
            width: min(100%, 620px);
            padding: clamp(24px, 6vw, 52px);
            border: 1px solid rgba(0, 243, 255, 0.8);
            background: linear-gradient(145deg, rgba(3, 18, 25, 0.98), rgba(0, 0, 0, 0.98) 65%);
            color: #c4fbff;
            text-align: center;
            box-shadow: 0 0 70px rgba(0, 243, 255, 0.18), inset 0 0 36px rgba(0, 243, 255, 0.06);
            animation: signal-arrive 650ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .signal-kicker {
            margin: 0 0 20px;
            color: #00f3ff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.22em;
        }

        .signal-mark {
            display: grid;
            width: 74px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            place-items: center;
            border: 1px solid rgba(0, 243, 255, 0.65);
            border-radius: 50%;
            color: #00f3ff;
            font-size: 1.8rem;
            box-shadow: 0 0 28px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.14);
            animation: signal-pulse 2.4s ease-in-out infinite;
        }

        .signal-title {
            margin: 0;
            color: white;
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 900;
            line-height: 1;
        }

        .signal-coordinates {
            margin: 18px 0;
            color: #71efff;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-variant-numeric: tabular-nums;
        }

        .signal-message {
            min-height: 3.5em;
            max-width: 420px;
            margin: 0 auto 28px;
            color: rgba(222, 251, 255, 0.78);
            font-size: 0.9rem;
            line-height: 1.65;
        }

        .signal-action {
            min-height: 48px;
            padding: 12px 22px;
            border: 1px solid #00f3ff;
            background: #00f3ff;
            color: #001014;
            font: inherit;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
        }

        .signal-action:hover:not(:disabled), .signal-action:focus-visible {
            background: transparent;
            color: #00f3ff;
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.25);
        }

        .signal-action:disabled { cursor: wait; opacity: 0.62; }

        @keyframes signal-arrive {
            from { opacity: 0; transform: translateY(18px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes signal-pulse {
            50% { box-shadow: 0 0 42px rgba(0, 243, 255, 0.48), inset 0 0 26px rgba(0, 243, 255, 0.24); transform: scale(1.04); }
        }

        @media (prefers-reduced-motion: reduce) {
            .signal-panel, .signal-mark { animation: none; }
        }
    </style>
</head>

<body class="relative w-screen h-screen select-none">

    <!-- Top HUD -->
    <div class="absolute top-6 left-6 z-10 pointer-events-none">
        <h1 class="text-xl font-bold tracking-widest text-[#00ff00] drop-shadow-[0_0_8px_#00ff00]">SYSTEM: SONIC ENIGMA</h1>
        <p class="text-xs text-[#00ff00] opacity-75">STATUS: UNKNOWN</p>
    </div>

    <!-- Settings Button -->
    <div class="absolute top-6 right-6 z-10">
        <button id="btn-settings" class="border border-[#00ff00] px-3 py-1 text-xs hover:bg-[#00ff00] hover:text-black transition-colors">[ SETTINGS ]</button>
    </div>

    <!-- Inventory Uplink Footer -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center">
        <span class="text-xs tracking-widest opacity-70 mb-2">INVENTORY_UPLINK</span>
        <div class="border border-[#00ff00] bg-black bg-opacity-80 p-2 flex gap-4">
            <button id="btn-map" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Map</button>
            <button id="btn-book" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Great Library Book</button>
            <button id="btn-radio" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Radio Tuner</button>
            <button id="btn-hacking" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Hacking System</button>
            <button id="btn-poison" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Poison</button>
            <button id="btn-hints" class="px-3 py-1 border border-[#00ff00] text-sm hover:bg-[#00ff00] hover:text-black transition-colors">Hints</button>
        </div>
    </div>

    <div id="signal-dialog" class="signal-overlay hidden fixed inset-0 z-[60] px-5 py-8" role="dialog" aria-modal="true" aria-labelledby="signal-dialog-title" aria-describedby="signal-dialog-message">
        <div class="signal-grid" aria-hidden="true"></div>
        <section class="signal-panel">
            <p class="signal-kicker">PHASE 02 / DEEP-SPACE UPLINK</p>
            <div class="signal-mark" aria-hidden="true">✦</div>
            <h2 id="signal-dialog-title" class="signal-title">SIGNAL DETECTED</h2>
            <p class="signal-coordinates">32.92 / -56°78 / 8e32</p>
            <p id="signal-dialog-message" class="signal-message" role="status" aria-live="polite">Constellation acquired. Synchronizing your mission profile…</p>
            <button id="signal-dialog-action" class="signal-action" type="button" disabled>[ SYNCHRONIZING ]</button>
        </section>
    </div>

    <div id="tool-dialog" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/80 p-6" role="dialog" aria-modal="true" aria-labelledby="tool-dialog-title">
        <section class="w-full max-w-md border border-[#00ff00] bg-black p-6 text-[#00ff00] shadow-[0_0_24px_rgba(0,255,0,0.2)]">
            <h2 id="tool-dialog-title" class="mb-3 text-lg font-bold"></h2>
            <p id="tool-dialog-message" class="mb-6 text-sm leading-relaxed"></p>
            <div class="flex justify-end gap-3">
                <button id="tool-dialog-action" class="hidden border border-[#00ff00] px-3 py-2 text-xs hover:bg-[#00ff00] hover:text-black"></button>
                <button id="tool-dialog-close" class="border border-[#00ff00] px-3 py-2 text-xs hover:bg-[#00ff00] hover:text-black">[ CLOSE ]</button>
            </div>
        </section>
    </div>

    <!-- Death Screen (Hidden by default) -->
    <div id="death-screen" class="hidden fixed inset-0 bg-red-950/90 z-50 flex flex-col justify-center items-center font-mono text-red-500">
        <h1 class="text-6xl font-bold mb-4 tracking-widest drop-shadow-[0_0_15px_red]">FATAL ERROR</h1>
        <p class="text-white text-xl">System contaminated by toxin ingestion.</p>
        <button onclick="location.reload()" class="mt-8 border border-red-500 text-red-500 px-6 py-2 hover:bg-red-500 hover:text-black transition-colors">[ REBOOT SYSTEM ]</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Phase 2 Game Logic -->
    <script src="phase2.js"></script>
    <script src="/game-tools.js"></script>
</body>

</html>
